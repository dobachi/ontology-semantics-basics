# 調査報告（HTML）を GitHub Pages に公開する。
# 図（figures/*.svg）、6 章（_elements.qmd）、説明ペーパー（deck/*.pptx）は生成物だが、
# リポジトリに入れてある。ここでは HTML と PDF を作る。PDF は、HTML の「他の形式」のリンク先になる。
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and tools for the PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk librsvg2-bin ghostscript
          fc-list | grep -c "Noto Serif CJK JP"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Build the PDFs
        run: make pdf PY=python3
      - name: Render HTML
        run: quarto render --to html
      - name: Put the PDFs where the HTML links to them
        run: |
          V=$(cat VERSION)
          cp pdf/ontology-semantics-basics.pdf "_output/ontology-semantics-basics-$V.pdf"
          cp pdf/ontology-semantics-basics-method.pdf "_output/ontology-semantics-basics-method-$V.pdf"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
