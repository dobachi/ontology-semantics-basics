<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" width="760" height="504" role="img" aria-label="一つの段に収まらない技術と、各段との関係" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="504" fill="#ffffff"/>
<rect x="150" y="271" width="112" height="64" fill="#dcefe8" stroke="#009E73" stroke-width="1.5"/>
<text x="206" y="291" font-size="12" fill="#1f2933" text-anchor="middle">1 段目</text>
<text x="206" y="310" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">形を検査</text>
<text x="206" y="327" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">できる</text>
<rect x="268" y="227" width="112" height="108" fill="#b9e0d1" stroke="#009E73" stroke-width="1.5"/>
<text x="324" y="247" font-size="12" fill="#1f2933" text-anchor="middle">2 段目</text>
<text x="324" y="266" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">同じものだと</text>
<text x="324" y="283" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">分かる</text>
<rect x="386" y="183" width="112" height="152" fill="#8fcfb7" stroke="#009E73" stroke-width="1.5"/>
<text x="442" y="203" font-size="12" fill="#1f2933" text-anchor="middle">3 段目</text>
<text x="442" y="222" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">用語の関係を</text>
<text x="442" y="239" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">たどれる</text>
<rect x="504" y="139" width="112" height="196" fill="#5fbc9a" stroke="#009E73" stroke-width="1.5"/>
<text x="560" y="159" font-size="12" fill="#1f2933" text-anchor="middle">4 段目</text>
<text x="560" y="178" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">定義から</text>
<text x="560" y="195" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">導ける</text>
<line x1="140" y1="335" x2="632" y2="335" stroke="#52606d" stroke-width="1.5"/>
<rect x="20" y="20" width="250" height="74" rx="8" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="145.0" y="44" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">DCAT、ダブリンコア</text>
<text x="145.0" y="66" font-size="13" fill="#52606d" text-anchor="middle">データそのものではなく、</text>
<text x="145.0" y="85" font-size="13" fill="#52606d" text-anchor="middle">データについての情報を書く</text>
<line x1="200" y1="94" x2="304" y2="225" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="150" y="150" font-size="12.5" fill="#1f2933" text-anchor="middle">2 段目の仕組みを使う</text>
<rect x="290" y="14" width="290" height="96" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="435.0" y="38" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">Palantir の Ontology</text>
<text x="435.0" y="60" font-size="13" fill="#52606d" text-anchor="middle">独自の形式で 1、2 段目に相当。3 段目は一部</text>
<text x="435.0" y="79" font-size="13" fill="#52606d" text-anchor="middle">4 段目にあたる推論は見当たらない</text>
<text x="435.0" y="98" font-size="13" fill="#52606d" text-anchor="middle">業務上の操作と結びつける</text>
<line x1="340" y1="110" x2="338" y2="225" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="332" y="172" font-size="12.5" fill="#1f2933" text-anchor="end">相当</text>
<line x1="452" y1="110" x2="448" y2="181" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="460" y="150" font-size="12.5" fill="#1f2933" text-anchor="start">一部</text>
<rect x="10" y="392" width="200" height="74" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="110.0" y="416" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">SHACL</text>
<text x="110.0" y="438" font-size="13" fill="#52606d" text-anchor="middle">グラフの形のデータを検査</text>
<text x="110.0" y="457" font-size="13" fill="#52606d" text-anchor="middle">役割は 1 段目と同じ</text>
<line x1="110" y1="392" x2="148" y2="305" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="222" y="392" width="266" height="74" rx="8" fill="#f1ebf7" stroke="#7B4EA3" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="355.0" y="416" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">セマンティックレイヤ、Apache Ossie</text>
<text x="355.0" y="438" font-size="13" fill="#52606d" text-anchor="middle">集計の計算方法をそろえる</text>
<text x="355.0" y="457" font-size="13" fill="#52606d" text-anchor="middle">1 段目の表の上に定義する</text>
<line x1="300" y1="392" x2="220" y2="337" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="500" y="392" width="250" height="74" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="625.0" y="416" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700">OKF</text>
<text x="625.0" y="438" font-size="13" fill="#52606d" text-anchor="middle">1 段目は最小限、2 段目は一部</text>
<text x="625.0" y="457" font-size="13" fill="#52606d" text-anchor="middle">3 段目はごく一部。残りは文章で渡す</text>
<line x1="520" y1="392" x2="250" y2="337" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<line x1="560" y1="392" x2="340" y2="337" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<line x1="600" y1="392" x2="460" y2="337" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="20" y="490" font-size="12.5" fill="#52606d" text-anchor="start">またがる: Palantir、OKF　　同じ役割を担う: SHACL　　別の軸にある: DCAT、セマンティックレイヤ</text>
</svg>