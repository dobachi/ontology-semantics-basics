<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="RDF Schema による推論" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="260" fill="#ffffff"/>
<rect x="30" y="30" width="330" height="80" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="195.0" y="54" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">宣言（RDF Schema）</text>
<text x="195.0" y="76" font-size="13" fill="#52606d" text-anchor="middle">ex:suppliedBy の主語は ex:Part</text>
<text x="195.0" y="95" font-size="13" fill="#52606d" text-anchor="middle">ex:suppliedBy の目的語は ex:Supplier</text>
<rect x="30" y="140" width="330" height="80" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="195.0" y="164" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">データ（RDF）</text>
<text x="195.0" y="186" font-size="13" fill="#52606d" text-anchor="middle">ex:P-100 ex:suppliedBy ex:S-01</text>
<rect x="420" y="85" width="120" height="62" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="480.0" y="109" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">推論</text>
<rect x="590" y="70" width="150" height="92" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="665.0" y="94" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">導かれる文</text>
<text x="665.0" y="116" font-size="13" fill="#52606d" text-anchor="middle">P-100 は Part</text>
<text x="665.0" y="135" font-size="13" fill="#52606d" text-anchor="middle">S-01 は Supplier</text>
<line x1="360" y1="70" x2="420" y2="106" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="360" y1="180" x2="420" y2="126" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="540" y1="116" x2="590" y2="116" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="30" y="248" font-size="13" fill="#52606d" text-anchor="start">宣言はデータを拒否するためではなく、書かれていない事実を補うために使われる。</text>
</svg>