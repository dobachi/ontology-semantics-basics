<text x="576" y="70" font-size="14.5" fill="#1f2933" text-anchor="start" font-weight="700">定義から導ける</text>
<text x="576" y="92" font-size="12.5" fill="#1f2933" text-anchor="start">RDF Schema、OWL</text>
<line x1="20" y1="290" x2="750" y2="290" stroke="#52606d" stroke-width="1.5"/>
<line x1="30" y1="318" x2="730" y2="318" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="380" y="340" font-size="13" fill="#52606d" text-anchor="middle">機械に渡す意味が増える</text>
