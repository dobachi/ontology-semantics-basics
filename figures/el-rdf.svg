<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="RDF のトリプルの例" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="270" fill="#ffffff"/>
<ellipse cx="140" cy="130" rx="100" ry="28" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="140" y="135" font-size="14" fill="#1f2933" text-anchor="middle" font-family="'Noto Sans Mono CJK JP','DejaVu Sans Mono',monospace">ex:P-100</text>
<ellipse cx="600" cy="60" rx="100" ry="28" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="600" y="65" font-size="14" fill="#1f2933" text-anchor="middle" font-family="'Noto Sans Mono CJK JP','DejaVu Sans Mono',monospace">ex:Part</text>
<ellipse cx="600" cy="130" rx="100" ry="28" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="600" y="135" font-size="14" fill="#1f2933" text-anchor="middle" font-family="'Noto Sans Mono CJK JP','DejaVu Sans Mono',monospace">ex:S-01</text>
<rect x="490" y="180" width="220" height="40" fill="#ffffff" stroke="#009E73" stroke-width="1.5"/>
<text x="600" y="205" font-size="14" fill="#1f2933" text-anchor="middle">"六角ボルト M8"</text>
<line x1="232" y1="115" x2="502" y2="68" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="360" y="78" font-size="13" fill="#1f2933" text-anchor="middle">rdf:type</text>
<line x1="240" y1="130" x2="500" y2="130" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="370.0" y="122" font-size="13" fill="#1f2933" text-anchor="middle">ex:suppliedBy</text>
<line x1="232" y1="145" x2="488" y2="196" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="350" y="190" font-size="13" fill="#1f2933" text-anchor="middle">ex:name</text>
<text x="140" y="180" font-size="13" fill="#52606d" text-anchor="middle">主語</text>
<text x="370" y="150" font-size="13" fill="#52606d" text-anchor="middle">述語</text>
<text x="600" y="22" font-size="13" fill="#52606d" text-anchor="middle">目的語</text>
<text x="40" y="255" font-size="13" fill="#52606d" text-anchor="start">すべての情報を「主語、述語、目的語」の 3 つ組で表す。楕円は識別子、四角は値。</text>
</svg>