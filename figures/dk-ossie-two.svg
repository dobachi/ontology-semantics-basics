<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Apache Ossie が近づく二つの相手" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="380" fill="#ffffff"/>
<rect x="270" y="140" width="220" height="96" rx="8" fill="#f1ebf7" stroke="#7B4EA3" stroke-width="1.5"/>
<text x="380.0" y="164" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">Apache Ossie</text>
<text x="380.0" y="186" font-size="13" fill="#52606d" text-anchor="middle">出発点は、指標と</text>
<text x="380.0" y="205" font-size="13" fill="#52606d" text-anchor="middle">ディメンションの交換</text>
<rect x="20" y="20" width="300" height="84" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="170.0" y="44" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">製品のオントロジー</text>
<text x="170.0" y="66" font-size="13" fill="#52606d" text-anchor="middle">Palantir、Goldman Sachs Legend</text>
<rect x="440" y="20" width="300" height="84" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="590.0" y="44" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">Web 標準系</text>
<text x="590.0" y="66" font-size="13" fill="#52606d" text-anchor="middle">RDF、OWL の語彙</text>
<line x1="320" y1="140" x2="210" y2="106" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="440" y1="140" x2="550" y2="106" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="150" y="128" font-size="12.5" fill="#1f2933" text-anchor="middle">ロードマップが先例に挙げる</text>
<text x="610" y="128" font-size="12.5" fill="#1f2933" text-anchor="middle">オントロジー仕様が関連づける</text>
<rect x="150" y="280" width="460" height="60" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380" y="305" font-size="13" fill="#1f2933" text-anchor="middle">Apache Incubator の公式な説明は、</text>
<text x="380" y="325" font-size="13" fill="#1f2933" text-anchor="middle">オントロジーに触れていない</text>
<text x="20" y="368" font-size="13" fill="#52606d" text-anchor="start">2026 年 4 月には、オントロジーの表現を扱うワーキンググループがあった。</text>
</svg>