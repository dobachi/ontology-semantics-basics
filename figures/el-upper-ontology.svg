<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="上位、中位、領域オントロジーの重なり" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="270" fill="#ffffff"/>
<rect x="230" y="20" width="300" height="56" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="380.0" y="44" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">上位オントロジー</text>
<text x="380.0" y="66" font-size="13" fill="#52606d" text-anchor="middle">例: BFO</text>
<rect x="150" y="100" width="460" height="56" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="380.0" y="124" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">中位オントロジー</text>
<text x="380.0" y="146" font-size="13" fill="#52606d" text-anchor="middle">例: Common Core Ontologies</text>
<rect x="40" y="180" width="680" height="56" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="380.0" y="204" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">領域オントロジー</text>
<text x="380.0" y="226" font-size="13" fill="#52606d" text-anchor="middle">例: 金融、生命科学、製造などの分野ごとのオントロジー</text>
<line x1="380" y1="100" x2="380" y2="78" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="380" y1="180" x2="380" y2="158" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="40" y="258" font-size="13" fill="#52606d" text-anchor="start">上位ほど一般的で、領域に依存しない。下の層は上の層の用語を特殊化して使う。</text>
</svg>