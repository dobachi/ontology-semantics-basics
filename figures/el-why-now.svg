<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="意味の定義が話題になる二つの理由" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<text x="20" y="28" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700">理由 1: 組織をまたいでデータを共有する</text>
<rect x="20" y="44" width="120" height="70" rx="8" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.5"/>
<text x="80.0" y="68" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">A 社</text>
<text x="80.0" y="90" font-size="13" fill="#52606d" text-anchor="middle">supplier_id</text>
<rect x="230" y="44" width="120" height="70" rx="8" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.5"/>
<text x="290.0" y="68" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">B 社</text>
<text x="290.0" y="90" font-size="13" fill="#52606d" text-anchor="middle">仕入先コード</text>
<rect x="110" y="150" width="150" height="62" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="185.0" y="174" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">共通の意味の定義</text>
<text x="185.0" y="196" font-size="13" fill="#52606d" text-anchor="middle">どちらも「供給者」</text>
<line x1="80" y1="114" x2="150" y2="148" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="290" y1="114" x2="220" y2="148" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="246" font-size="12.5" fill="#52606d" text-anchor="start">組織の間では、列の名前の意味を</text>
<text x="20" y="264" font-size="12.5" fill="#52606d" text-anchor="start">その場ですり合わせられない。</text>
<line x1="378" y1="14" x2="378" y2="290" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="400" y="28" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700">理由 2: AI がデータを読む</text>
<rect x="400" y="96" width="130" height="70" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="465.0" y="120" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">一つの定義</text>
<text x="465.0" y="142" font-size="13" fill="#52606d" text-anchor="middle">指標や規則</text>
<rect x="600" y="48" width="140" height="44" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="670" y="75" font-size="13.5" fill="#1f2933" text-anchor="middle">ダッシュボード</text>
<line x1="532" y1="131" x2="598" y2="70" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="110" width="140" height="44" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="670" y="137" font-size="13.5" fill="#1f2933" text-anchor="middle">SQL</text>
<line x1="532" y1="131" x2="598" y2="132" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="172" width="140" height="44" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="670" y="199" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="700">AI エージェント</text>
<line x1="532" y1="131" x2="598" y2="194" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="400" y="246" font-size="12.5" fill="#52606d" text-anchor="start">定義がなければ、AI は意味を推測する。</text>
<text x="400" y="264" font-size="12.5" fill="#52606d" text-anchor="start">推測は外れることがあり、毎回同じとも限らない。</text>
<text x="20" y="314" font-size="12.5" fill="#1f2933" text-anchor="start">どちらも、意味をあらかじめ定義して機械に渡すことを求める。</text>
</svg>