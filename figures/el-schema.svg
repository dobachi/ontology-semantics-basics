<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="スキーマによる文書の検査" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="270" fill="#ffffff"/>
<rect x="30" y="30" width="300" height="80" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="180.0" y="54" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">文書 1</text>
<text x="180.0" y="76" font-size="13" fill="#52606d" text-anchor="middle">part_id: "P-100"、name、supplier_id</text>
<rect x="30" y="150" width="300" height="80" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="180.0" y="174" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">文書 2</text>
<text x="180.0" y="196" font-size="13" fill="#52606d" text-anchor="middle">part_id: "100"、name のみ</text>
<rect x="390" y="90" width="140" height="80" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="460.0" y="114" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">スキーマ</text>
<text x="460.0" y="136" font-size="13" fill="#52606d" text-anchor="middle">必須の項目</text>
<text x="460.0" y="155" font-size="13" fill="#52606d" text-anchor="middle">値の型と形式</text>
<rect x="590" y="30" width="150" height="80" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="665.0" y="54" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">適合</text>
<text x="665.0" y="76" font-size="13" fill="#52606d" text-anchor="middle">条件をすべて満たす</text>
<rect x="590" y="150" width="150" height="80" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="665.0" y="174" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">不適合</text>
<text x="665.0" y="196" font-size="13" fill="#52606d" text-anchor="middle">番号の形式が違う</text>
<text x="665.0" y="215" font-size="13" fill="#52606d" text-anchor="middle">供給者がない</text>
<line x1="330" y1="70" x2="390" y2="115" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="190" x2="390" y2="145" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="530" y1="115" x2="590" y2="70" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="530" y1="145" x2="590" y2="190" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="30" y="258" font-size="13" fill="#52606d" text-anchor="start">項目と型がそろっているかは検査できるが、項目の意味は扱わない。</text>
</svg>