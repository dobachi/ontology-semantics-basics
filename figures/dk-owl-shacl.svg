<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="OWL と SHACL の違い" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="380" fill="#ffffff"/>
<rect x="230" y="20" width="300" height="84" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="380.0" y="44" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">データ</text>
<text x="380.0" y="66" font-size="13" fill="#52606d" text-anchor="middle">部品 P-200</text>
<text x="380.0" y="85" font-size="13" fill="#52606d" text-anchor="middle">供給者が書かれていない</text>
<rect x="40" y="170" width="310" height="120" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="195.0" y="194" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">OWL（推論）</text>
<text x="195.0" y="216" font-size="13" fill="#52606d" text-anchor="middle">書かれていないことは「未知」</text>
<text x="195.0" y="235" font-size="13" fill="#52606d" text-anchor="middle">供給者はいるかもしれない</text>
<text x="195.0" y="254" font-size="13" fill="#52606d" text-anchor="middle">誤りとは判定しない</text>
<rect x="410" y="170" width="310" height="120" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.5"/>
<text x="565.0" y="194" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">SHACL（検査）</text>
<text x="565.0" y="216" font-size="13" fill="#52606d" text-anchor="middle">書かれていなければ「違反」</text>
<text x="565.0" y="235" font-size="13" fill="#52606d" text-anchor="middle">供給者は必須、という条件に</text>
<text x="565.0" y="254" font-size="13" fill="#52606d" text-anchor="middle">合わないと報告する</text>
<line x1="320" y1="104" x2="210" y2="168" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="440" y1="104" x2="550" y2="168" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="195" y="318" font-size="13" fill="#D55E00" text-anchor="middle" font-weight="700">開世界の前提</text>
<text x="565" y="318" font-size="13" fill="#009E73" text-anchor="middle" font-weight="700">閉じたデータとして検査</text>
<text x="40" y="360" font-size="13" fill="#52606d" text-anchor="start">定義から導きたいときは OWL、条件を満たすか調べたいときは SHACL を使う。</text>
</svg>