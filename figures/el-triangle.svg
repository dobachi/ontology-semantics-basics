<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="意味の三角形と四つの言葉" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<line x1="210" y1="296" x2="330" y2="114" stroke="#52606d" stroke-width="1.8"/>
<line x1="430" y1="114" x2="550" y2="296" stroke="#52606d" stroke-width="1.8"/>
<line x1="262" y1="330" x2="498" y2="330" stroke="#52606d" stroke-width="1.8" stroke-dasharray="6 5"/>
<rect x="270" y="26" width="220" height="88" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="380.0" y="50" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">概念</text>
<text x="380.0" y="72" font-size="13" fill="#52606d" text-anchor="middle">「部品を供給する会社」</text>
<text x="380.0" y="91" font-size="13" fill="#52606d" text-anchor="middle">という考え</text>
<text x="260" y="44" font-size="11" fill="#52606d" text-anchor="end">原典:</text>
<text x="260" y="59" font-size="11" fill="#52606d" text-anchor="end">Thought or Reference</text>
<rect x="40" y="286" width="220" height="88" rx="8" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.5"/>
<text x="150.0" y="310" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">記号</text>
<text x="150.0" y="332" font-size="13" fill="#52606d" text-anchor="middle">列の名前 supplier_id</text>
<text x="150.0" y="351" font-size="13" fill="#52606d" text-anchor="middle">値 S-01</text>
<text x="150" y="278" font-size="11" fill="#52606d" text-anchor="middle">原典: Symbol</text>
<rect x="500" y="286" width="220" height="88" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="610.0" y="310" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">対象</text>
<text x="610.0" y="332" font-size="13" fill="#52606d" text-anchor="middle">実在する会社</text>
<text x="610.0" y="351" font-size="13" fill="#52606d" text-anchor="middle">東和精工</text>
<text x="610" y="278" font-size="11" fill="#52606d" text-anchor="middle">原典: Referent</text>
<text x="232" y="196" font-size="13" fill="#1f2933" text-anchor="end">表す</text>
<text x="528" y="196" font-size="13" fill="#1f2933" text-anchor="start">指す</text>
<text x="380" y="322" font-size="13" fill="#52606d" text-anchor="middle">直接にはつながらない</text>
<text x="150" y="398" font-size="14" fill="#0072B2" text-anchor="middle" font-weight="700">データモデル</text>
<text x="150" y="418" font-size="12.5" fill="#52606d" text-anchor="middle">記号の並べ方を決める</text>
<text x="510" y="56" font-size="14" fill="#D55E00" text-anchor="start" font-weight="700">オントロジー</text>
<text x="510" y="76" font-size="12.5" fill="#52606d" text-anchor="start">概念と、その関係を</text>
<text x="510" y="94" font-size="12.5" fill="#52606d" text-anchor="start">明示的に書き表す</text>
<text x="92" y="170" font-size="14" fill="#009E73" text-anchor="middle" font-weight="700">セマンティクス</text>
<text x="92" y="190" font-size="12.5" fill="#52606d" text-anchor="middle">記号が何を表し、</text>
<text x="92" y="208" font-size="12.5" fill="#52606d" text-anchor="middle">何を指すかの対応</text>
<rect x="14" y="14" width="732" height="424" rx="10" fill="none" stroke="#7B4EA3" stroke-width="1.5" stroke-dasharray="3 5"/>
<text x="732" y="456" font-size="13" fill="#7B4EA3" text-anchor="end" font-weight="700">標準化: この対応を、組織をまたいでそろえる</text>
