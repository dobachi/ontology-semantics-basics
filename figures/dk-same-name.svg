<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="同じ名前で違うものを指す例" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
<text x="40" y="50" font-size="15" fill="#1f2933" text-anchor="start" font-weight="700">A 社の部品表</text>
<rect x="40" y="60" width="130" height="30" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.2"/>
<rect x="40" y="90" width="130" height="30" fill="#ffffff" stroke="#0072B2" stroke-width="1.2"/>
<text x="105.0" y="80" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700" font-family="'Noto Sans Mono CJK JP','DejaVu Sans Mono',monospace">part_id</text>
<text x="105.0" y="110" font-size="13" fill="#1f2933" text-anchor="middle">P-100</text>
<rect x="170" y="60" width="130" height="30" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.2"/>
<rect x="170" y="90" width="130" height="30" fill="#ffffff" stroke="#0072B2" stroke-width="1.2"/>
<text x="235.0" y="80" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700" font-family="'Noto Sans Mono CJK JP','DejaVu Sans Mono',monospace">重量</text>
<text x="235.0" y="110" font-size="13" fill="#1f2933" text-anchor="middle">12</text>
<text x="460" y="50" font-size="15" fill="#1f2933" text-anchor="start" font-weight="700">B 社の部品表</text>
<rect x="460" y="60" width="130" height="30" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.2"/>
<rect x="460" y="90" width="130" height="30" fill="#ffffff" stroke="#0072B2" stroke-width="1.2"/>
<text x="525.0" y="80" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700" font-family="'Noto Sans Mono CJK JP','DejaVu Sans Mono',monospace">part_id</text>
<text x="525.0" y="110" font-size="13" fill="#1f2933" text-anchor="middle">P-100</text>
<rect x="590" y="60" width="130" height="30" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.2"/>
<rect x="590" y="90" width="130" height="30" fill="#ffffff" stroke="#0072B2" stroke-width="1.2"/>
<text x="655.0" y="80" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700" font-family="'Noto Sans Mono CJK JP','DejaVu Sans Mono',monospace">重量</text>
<text x="655.0" y="110" font-size="13" fill="#1f2933" text-anchor="middle">0.03</text>
<text x="170" y="150" font-size="13" fill="#52606d" text-anchor="middle">グラム。部品そのものの重さ</text>
<text x="590" y="150" font-size="13" fill="#52606d" text-anchor="middle">キログラム。梱包を含む重さ</text>
<rect x="250" y="210" width="260" height="70" rx="8" fill="#fcefe6" stroke="#D55E00" stroke-width="1.5"/>
<text x="380.0" y="234" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="700">列の名前はどちらも「重量」</text>
<text x="380.0" y="256" font-size="13" fill="#52606d" text-anchor="middle">単位も、何の重さかも書かれていない</text>
<line x1="170" y1="160" x2="300" y2="208" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="590" y1="160" x2="460" y2="208" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<text x="40" y="320" font-size="13" fill="#52606d" text-anchor="start">名前がそろっていても、意味がそろっているとは限らない。数値は説明用の例である。</text>
