    notes: "近づいているという評価は筆者の考察。"

  - type: split
    title: "OKF は知識を文章のまま渡す"
    image: "figures/dk-okf.png"
    bullets:
      - "1 概念を 1 つの Markdown で表す"
      - "型、URI、リンクは機械が読める"
      - "語彙は登録せず、関係の種類は文章が伝える"
      - "Ossie との違いは、どこまでを構造にするか"
    source: "出典: Google Cloud ブログ (2026)、Open Knowledge Format 仕様 0.2 版。二つに分けて見るのは筆者の整理"
    notes: "Open Knowledge Format（OKF）は Google Cloud が 2026 年 6 月に発表した。分析系の延長にあり、意味の 4 段階では 1 段目を最小限に、2 段目と 3 段目をごく一部だけ備える、というのは筆者の考察。"

  # ---------------------------------------------------------------- 07

  - type: section
    number: "07"
    title: "データスペースとの接点"

  - type: split
    title: "意味は相互運用性の四層の一つである"
    image: "figures/el-eif.png"
