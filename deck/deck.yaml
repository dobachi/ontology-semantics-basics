    steps:
      - {label: "2025 年 9 月", text: "OSI を発表"}
      - {label: "2026 年 1 月", text: "最初の仕様を公開"}
      - {label: "2026 年 6 月", text: "Incubator 入り"}
      - {label: "2026 年 7 月", text: "改称を公表"}
