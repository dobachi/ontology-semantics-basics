# 初心者向け説明ペーパー。調査報告（index.qmd）の構成と図に沿って要約したもの。
# ビルド: README.md の「説明ペーパー」を参照。独自テンプレート deck/template/simple.pptx に流し込む。
# 見た目（書体、色、位置、図と説明の比率）はテンプレートのスライドマスタが決める。横に長い図のスライドは layout で「図と説明（横長）」を指定している。
meta:
  aspect: "16:9"
  accent: "0B7A5C"
  footer: "© 2026 Masaru Dobashi, CC BY 4.0"
  date: "2026-10-04.5"
  page_numbers: true
  nest_under_heading: true

slides:
  - type: title
    title: "データの「意味」をそろえる技術の全体像"
    subtitle: "オントロジー・セマンティクス・データモデル標準化 入門"
    presenter: "土橋"
    date: "2026-10-04.5"
    notes: "初めてこの分野に触れる人向けの説明資料。構成は調査報告の章立てに沿う。詳細と出典は調査報告にある。"

  # ---------------------------------------------------------------- 01

  - type: section
    number: "01"
    title: "何が問題なのか"

  - type: split
    title: "同じものでも、会社ごとに呼び名が違う"
    image: "figures/el-intro.png"
    bullets:
      - "名前からは、同じものらしいと見当がつくだけ"
      - "人も AI も、名前だけでは断定できない"
      - "確かにするには、共通の語彙への対応づけが要る"
    source: "列の名前は説明用の例"

  - type: split
    title: "名前がそろっても、意味はそろわない"
    image: "figures/dk-same-name.png"
    bullets:
      - "「重量」はグラムか、キログラムか"
      - "梱包を含む重さか、部品そのものの重さか"
      - "「価格」は税込か、税抜か"
      - "「日付」は発注日か、納品日か"
    notes: "同じ名前で違うものを指す場合の例。説明用の例であり、特定の出典はない。"

  - type: split
    title: "話題になる理由は二つある"
    image: "figures/el-why-now.png"
    layout: "図と説明（横長）"
    bullets:
      - "どちらも、意味をあらかじめ定義して機械に渡すことを求める"
    source: "出典: 欧州相互運用性フレームワーク (2017)、IPA ODS-RAM、Databricks (2026)。AI の推測が安定しないという点は筆者の見方"
    notes: "意味の定義が話題になる二つの理由（筆者の整理）。組織をまたぐ共有と、AI がデータを読むこと。どちらも、意味をあらかじめ定義して機械に渡すことを求める。"

  # ---------------------------------------------------------------- 02

  - type: section
    number: "02"
    title: "整理の軸と四つの言葉"

  - type: table
    title: "この資料は五つの軸で整理する"
    columns: ["軸", "並べるもの", "分かること", "出どころ", "扱う部"]
    rows:
      - ["意味の三角形", "記号、概念、対象", "言葉が何を扱うか", "Ogden と Richards", "02"]
      - ["意味の連続体", "成果物の種類", "どれだけ形式的か", "Uschold と Gruninger", "03"]
      - ["意味の 4 段階", "機械にできること", "何ができ、何ができないか", "筆者", "03"]
      - ["四本の流れ", "取り組みの系譜", "誰が何のために進めたか", "筆者", "04"]
      - ["共有の範囲", "組織内か、組織間か", "誰と意味を共有するか", "筆者", "07、08"]
    widths: [1.7, 2.1, 2.7, 2.3, 1.0]
    source: "調査報告の「この報告書で使う整理の軸」による"

  - type: split
    title: "四つの言葉は扱う場所が違う"
    image: "figures/el-triangle.png"
    heading: "四つの言葉"
    bullets:
      - "データモデル: 記号の並べ方を決める"
      - "セマンティクス: 記号が何を表し、何を指すか"
      - "オントロジー: 概念と関係を書き表す"
      - "標準化: それを組織の間でそろえる"
    source: "三角形は Ogden と Richards (1923) の図をもとに作成。頂点の日本語の呼び名と、四つの言葉の位置づけは筆者による"
    notes: "意味の三角形と四つの言葉。データモデルは記号の並べ方、セマンティクスは記号が何を表し何を指すか、オントロジーは概念の書き表し、標準化はそれを組織間でそろえること。"

  - type: cards
    title: "「オントロジー」には三つの用法がある"
    cards:
      - {label: "知識工学", text: "概念化の明示的な仕様。Gruber が定義し、Studer らが共有と形式性を加えた形にした"}
      - {label: "Web 標準", text: "OWL のような言語で書いたもの。日本の ODS の実装もこの用法"}
      - {label: "製品", text: "Palantir は自社の Ontology を、組織の運用レイヤと定義する"}
    source: "出典: Gruber (1993)、Studer ら (1998)、W3C OWL 2 (2012)、Palantir 公式文書"

  # ---------------------------------------------------------------- 03

  - type: section
    number: "03"
    title: "意味には四つの段階がある"

  - type: split
    title: "先行する整理は成果物の種類を並べる"
    image: "figures/el-spectrum.png"
    layout: "図と説明（横長）"
    bullets:
      - "用語集から形式的なオントロジーまでを、一本の軸に置く"
      - "進むほど形式的になり、自動推論への支援も増す"
      - "ただし、機械にできることを段階に分けてはいない"
    source: "出典: Uschold と Gruninger (2004)、McGuinness (2003)。図は Uschold と Gruninger の図をもとに作成"

  - type: split
    title: "AI が読み手に加わり、問いが変わった"
    image: "figures/dk-readers.png"
    bullets:
      - "先行する整理は、人が成果物を見分けるためのもの"
      - "近年は、AI も意味の定義の読み手に挙げられる"
      - "問いは「機械はそれで何ができるか」に変わった"
    source: "出典: Snowflake の OSI 発表文 (2025)、Databricks (2026)。いずれも製品ベンダの説明。軸を加えた理由は筆者の考察"

  - type: split
    title: "段を上がるほど、機械にできることが増える"
    image: "figures/el-ladder.png"
    bullets:
      - "機械にできることを基準に、四つの段に並べる"
      - "2 段目から 4 段目は積み上がる"
      - "1 段目の検査はどの段のデータにも別に行える"
    source: "意味の 4 段階は筆者の整理"

  - type: table
    title: "部品と供給者の例で四つの段を見る"
    columns: ["段", "機械ができること", "例", "代表的な技術"]
    rows:
      - ["1", "形を検査できる", "重量の欄に数値が入っている", "JSON Schema、関係モデル"]
      - ["2", "同じものだと分かる", "A 社と B 社の列が、どちらも供給者を指す", "RDF と共有の語彙"]
      - ["3", "用語の関係をたどれる", "ボルトは締結部品より狭い語", "SKOS"]
      - ["4", "定義から導ける", "供給者を持つものは調達品", "RDF Schema、OWL"]
    widths: [0.5, 2, 3.2, 2.3]
    source: "筆者の整理。例は説明用に作成したもの"

  - type: split
    title: "並べ直すと、順が入れ替わる"
    image: "figures/dk-spectrum-ladder.png"
    bullets:
      - "スキーマは 1 段目、シソーラスは 3 段目にあたる"
      - "基準が、形式性から機械にできることへ変わったため"
      - "2 段目にあたるものは、連続体にはない"
    source: "出典: Uschold と Gruninger (2004)。意味の 4 段階と、二つの対応は筆者の整理"

  - type: split
    title: "段を上がると、概念まで機械に渡る"
    image: "figures/el-triangle-steps.png"
    heading: "段ごとに渡すもの"
    bullets:
      - "1 段目は記号の形だけを決める"
      - "2 段目は記号と概念を結ぶ"
      - "3、4 段目は概念の中身を書く"
      - "概念と対象の対応は機械には渡らない"
    source: "対応づけは筆者による。原典の図には書かれていない"
    notes: "意味の三角形と意味の 4 段階の対応（筆者の整理）。1 段目は記号の形だけを決める。2 段目は記号と概念を結ぶ。3、4 段目は概念の中身を書く。概念と対象の対応は、どの段でも機械には渡らない。"

  - type: split
    title: "一つの段に収まらない技術もある"
    image: "figures/dk-not-fit.png"
    layout: "図と説明（横長）"
    bullets:
      - "4 段階は、機械にできることを一つずつ切り出したもの"
      - "現実の技術は、その一つだけを担うとは限らない"
    source: "筆者の整理"

  - type: split
    title: "収まらない技術も、どこかの段と関係する"
    image: "figures/el-off-ladder.png"
    bullets:
      - "Palantir と OKF は、下の段を一部ずつ備える"
      - "SHACL は、1 段目の検査をグラフに対して行う"
      - "DCAT は 2 段目の仕組みを使う"
      - "セマンティックレイヤは、1 段目の表の上に載る"
    source: "筆者の整理"

  # ---------------------------------------------------------------- 04

  - type: section
    number: "04"
