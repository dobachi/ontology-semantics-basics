    source: "出典: Dataspace Protocol 2025-1、ODS のプロトコル仕様、IPA「Why Open Dataspaces」(2026)。対比は筆者の整理"
    notes: "データスペースプロトコルと ODS が、意味の 4 段階のどこを規範に置くか。プロトコルは 1 段目、ODS は 2 段目の RDF を規範に置く。ODS の OWL は設計思想の文書が採用を述べるもので、規範的な要件は確認できていない。"

