      - "指標、ディメンション、結合を定義する"
      - "どのツールでも同じ数字になる"
    source: "出典: AtScale 用語集、Google Cloud (2024)"

  - type: split
    title: "標準は形か言葉のどちらかをそろえる"
    image: "figures/el-datamodel-map.png"
    bullets:
      - "左は項目の並びや型を決める"
      - "右は項目の名前が何を指すかを決める"
    source: "各標準の出典は調査報告の 7 章。左右の分け方は筆者の整理"
    notes: "データモデルとメタデータの標準が、何をそろえるか。左は項目の並びや型を決める。右は項目の名前が何を指すかを決める。"

  - type: split
    title: "業界の標準はオントロジーだけではない"
    image: "figures/el-domain-map.png"
    heading: "標準の種類"
    bullets:
      - "概念と関係を定義するもの"
      - "言葉や項目をそろえるもの"
      - "やり取りの形を決めるもの"
      - "分野を問わない上位と中位がある"
    source: "種類の分け方は、各団体の自己記述をもとにした筆者の整理"
    notes: "ドメインオントロジーと業界標準の見取り図。概念と関係を定義するもの、言葉や項目をそろえるもの、やり取りの形を決めるものが混ざっている。"

  # ---------------------------------------------------------------- 06

  - type: section
    number: "06"
    title: "近年の米国企業の動き"

  - type: table
    title: "米国企業の動きは五つに分けて見る"
    columns: ["順", "動き", "代表", "狙い", "意味の 4 段階との関係"]
    rows:
      - ["1", "知識グラフ", "Google、Wikidata", "事物と関係をグラフで持つ", "RDF で書けば 2 段目"]
      - ["2", "製品のオントロジー", "Palantir", "データを業務の操作と結ぶ", "またがる。1 段目から 3 段目"]
      - ["3", "セマンティックレイヤ", "Looker、Power BI、dbt", "指標の定義を一か所に置く", "別の軸にある"]
      - ["4", "交換のための仕様", "OSI、Apache Ossie", "定義をツールの間でそろえる", "別の軸から、意味の定義へ広がる"]
      - ["5", "文脈を渡す形式", "OKF", "知識を文章のまま AI に渡す", "またがる。下の段を一部ずつ備える"]
    widths: [0.5, 2.0, 2.2, 2.6, 3.0]
    source: "筆者の整理。3 から 5 は分析系の流れに属する。以下、この順に説明する"
    notes: "6 部の見取り図。このあとのスライドは、この表の順に並ぶ。知識グラフが 1 枚、Palantir が 2 枚、分析系の経緯が 1 枚、OSI と Apache Ossie が 2 枚、OKF が 1 枚。"

  - type: split
    title: "知識グラフは事物と関係をグラフで持つ"
    image: "figures/ext-wikidata-datamodel.png"
    bullets:
      - "Google は 2012 年に、文字列ではなく事物を扱うと紹介した"
      - "Wikidata は、値に修飾子と情報源を付けて記録する"
      - "GraphRAG は、言語モデルと知識グラフを組み合わせる"
