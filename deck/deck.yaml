    image: "figures/el-palantir.png"
    bullets:
      - "箱がオブジェクト型、矢印がリンク型"
      - "各オブジェクト型はプロパティを持つ"
      - "これに、アクションや関数が加わる"
    source: "Palantir の公式文書の図をもとに作成"
    notes: "Palantir の Ontology の例（航空業界）。箱がオブジェクト型、矢印がリンク型。これに、アクションや関数といった動的な要素が加わる。"

  - type: table
    title: "Palantir は推論より操作を重んじる"
    columns: ["段", "Palantir の Ontology", "判定"]
    rows:
      - ["1 形の検査", "必須プロパティ、値の制約、主キーの一意性", "備える"]
      - ["2 同じものと分かる", "複数のデータ源を共通のオブジェクトに対応づける", "一つの基盤の中で備える"]
