    source: "筆者の整理"

  - type: split
    title: "2 段目から上は Web 標準系が担う"
    image: "figures/el-ladder-streams.png"
    bullets:
      - "データベース系は 1 段目。データの形を決める"
      - "2 から 4 段目の代表的な技術は、Web 標準系の仕様"
      - "知識表現系は4 段目の理論を支える"
      - "分析系は別の軸にあり、指標の計算をそろえる"
    source: "筆者の整理"

  # ---------------------------------------------------------------- 05

  - type: section
    number: "05"
    title: "代表的な技術と標準を見る"

  - type: split
    title: "RDF はすべてを三つ組で書く"
    image: "figures/el-rdf.png"
    bullets:
      - "主語、述語、目的語の組で表す"
      - "識別子は Web 全体で一意"
