  - type: split
    title: "OWL は推論し、SHACL は検査する"
    image: "figures/dk-owl-shacl.png"
    bullets:
      - "OWL は、定義から書かれていないことを導く"
      - "SHACL は、データが条件を満たすかを調べる"
      - "同じデータでも、扱いが分かれる"
    source: "出典: W3C OWL 2 (2012)、W3C SHACL (2017)。図の例は説明用に作成したもの"

  - type: split
    title: "指標の定義は一か所に置く"
    image: "figures/el-semantic-layer.png"
    heading: "セマンティックレイヤ"
    bullets:
