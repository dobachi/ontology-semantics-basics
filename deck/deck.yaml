  - type: split
    title: "Ossie は二つの相手に近づいている"
    image: "figures/dk-ossie-two.png"
    bullets:
      - "先例に挙げるのは、製品のオントロジー"
      - "仕様が関連づけるのは、RDF や OWL の語彙"
