    source: "出典: 米国特許 5,555,403、Stancil (2021)、Snowflake (2025、2026)、OMG CWM (2003)、JSR 69。過去との違いは筆者の考察"
    notes: "2025 年 9 月から 2026 年 7 月の約 10 か月に七つの出来事が続いた。OSI の発表、MetricFlow のオープンソース化、OSI 仕様の公開、Databricks の一般提供、OKF の発表、Ossie の Apache Incubator 入り、OKF の 0.2 版。根拠は当事者の発表で、採用の実績は評価していない。「複雑だから RDF を避けた」と述べた当事者は見つかっていない。"

