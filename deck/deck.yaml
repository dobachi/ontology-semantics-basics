      - "2025-1 版は、JSON Schema に合うことを求めた"
      - "語彙は残り、意味を捨てたわけではない"
    source: "出典: IDS-RAM 4.0、Dataspace Protocol 2024-1 と 2025-1。意味の 4 段階での位置は筆者の整理"
    notes: "規範の置き方の移り変わり。2024-1 版はメッセージを JSON-LD として扱うことを求めた。2025-1 版は JSON Schema に合うことを求め、JSON-LD の処理を任意にした。"

  - type: split
